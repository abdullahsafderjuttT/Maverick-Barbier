<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480">
  <rect width="600" height="480" fill="#0D3B2A"/>
  <rect x="0" y="0" width="600" height="480" fill="url(#g)" opacity="0.4"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B8A54"/>
      <stop offset="1" stop-color="#06231A"/>
    </linearGradient>
  </defs>
  <!-- back wall shelf -->
  <rect x="40" y="60" width="520" height="10" fill="#F6F8F5" opacity="0.25"/>
  <rect x="40" y="140" width="520" height="10" fill="#F6F8F5" opacity="0.25"/>
  <!-- bottles -->
  <g fill="#F6F8F5" opacity="0.5">
    <rect x="70" y="75" width="16" height="55" rx="3"/>
    <rect x="100" y="80" width="14" height="50" rx="3"/>
    <rect x="130" y="70" width="18" height="60" rx="3"/>
    <rect x="440" y="150" width="16" height="55" rx="3"/>
    <rect x="470" y="155" width="14" height="50" rx="3"/>
    <rect x="500" y="148" width="18" height="58" rx="3"/>
  </g>
  <!-- round mirror -->
  <circle cx="300" cy="150" r="70" fill="none" stroke="#F6F8F5" stroke-width="4" opacity="0.6"/>
  <circle cx="300" cy="150" r="60" fill="#F6F8F5" opacity="0.06"/>
  <!-- barber chair -->
  <g stroke="#F6F8F5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M220 420 L220 340 Q220 300 260 300 L340 300 Q380 300 380 340 L380 380"/>
    <path d="M220 340 L380 340"/>
    <line x1="230" y1="420" x2="230" y2="460"/>
    <line x1="370" y1="420" x2="370" y2="460"/>
    <line x1="200" y1="460" x2="400" y2="460"/>
    <circle cx="300" cy="270" r="12" fill="#F6F8F5" opacity="0.85" stroke="none"/>
    <line x1="300" y1="282" x2="300" y2="300"/>
  </g>
  <!-- hanging pendant lights -->
  <g stroke="#F6F8F5" stroke-width="3" opacity="0.5">
    <line x1="150" y1="0" x2="150" y2="60"/>
    <circle cx="150" cy="70" r="12" fill="#F6F8F5" opacity="0.5"/>
    <line x1="450" y1="0" x2="450" y2="60"/>
    <circle cx="450" cy="70" r="12" fill="#F6F8F5" opacity="0.5"/>
  </g>
</svg>
